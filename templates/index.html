<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>medicine_remainder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121225;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #1c1c36;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #a0a0c0;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2e2e54;
            background-color: #121225;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #a0a0c0;
        }

        .toggle-link a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo Header -->
        <svg class="logo" viewBox="0 0 24 24" fill="#38bdf8">
            <path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-15z"/>
        </svg>
        <h2>medicine_remainder</h2>

        <!-- LOGIN FORM -->
        <form id="login-form" action="/login" method="POST">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div class="toggle-link">
                New patient? <a onclick="showRegister()">Create Account</a>
            </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" action="/register" method="POST" class="hidden">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" placeholder="Choose a password" required>
            </div>
            <div class="form-group">
                <label>EMAIL</label>
                <input type="email" name="email" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>AGE</label>
                <input type="number" name="age" placeholder="Enter age">
            </div>
            <div class="form-group">
                <label>DISEASE / CONDITION</label>
                <input type="text" name="disease" placeholder="Enter condition">
            </div>
            <button type="submit" class="btn">Register</button>
            <div class="toggle-link">
                Already have an account? <a onclick="showLogin()">Sign In</a>
            </div>
        </form>
    </div>

    <script>
        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
