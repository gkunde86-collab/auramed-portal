<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraMed - Smart Medicine Reminder</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .user-status {
            font-size: 0.9rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-link {
            color: var(--danger);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .clock-widget {
            text-align: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .clock-time {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Reminder Items */
        .reminder-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .reminder-item {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reminder-info h4 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .reminder-info p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Alarm Pop-up Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--danger);
            padding: 2.5rem;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .bell-icon {
            font-size: 3rem;
            color: var(--danger);
            margin-bottom: 1rem;
            animation: ring 1s infinite alternate;
        }

        @keyframes ring {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-capsules"></i> AuraMed Health Portal
        </div>
        <div class="user-status">
            <span><i class="fa-solid fa-circle-user"></i> Patient Account</span>
            <a href="/login" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
        </div>
    </nav>

    <div class="container">
        
        <div class="card">
            <div class="clock-widget">
                <i class="fa-regular fa-clock" style="color: var(--text-sub);"></i>
                <div class="clock-time" id="realtime-clock">00:00:00 AM</div>
                <span style="font-size: 0.8rem; color: var(--text-sub);">System Time</span>

            <div class="form-group">
                <label>Medicine Name</label>
                <input type="text" id="med-name" placeholder="e.g. Metformin 500mg">

            <div class="form-group">
                <label>Schedule Time</label>
                <input type="time" id="med-time">
            </div>

            <div class="form-group">
                <label>Condition / Notes</label>

            <button class="btn" onclick="addReminder()"><i class="fa-solid fa-check"></i> Set Alarm Reminder</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-list-check"></i> Active Prescriptions & Alarms</h3>
            <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 1rem;">Alarms trigger visual alerts and tones automatically.</p>

            <div class="reminder-list" id="reminder-container">
                </div>
        </div>

    </div>

    <div class="modal-overlay" id="alarm-popup">
        <div class="modal-box">
            <i class="fa-solid fa-bell bell-icon"></i>
            <h2 style="color: var(--danger); margin-bottom: 0.5rem;">MEDICINE TIME!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;" id="modal-med-title">Paracetamol</p>
            <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 1.5rem;" id="modal-med-note">Take with water</p>
            <button class="btn" style="background: var(--danger);" onclick="dismissAlarm()"><i class="fa-solid fa-xmark"></i> Dismiss Alarm</button>
        </div>
    </div>
